services:

  frontend:

    build: ./apps/frontend

    ports:
      - "3000:3000"

    depends_on:
      - backend


  backend:

    build:
      context: .
      dockerfile: apps/backend/Dockerfile

    ports:
      - "4000:4000"

    env_file:
      - apps/backend/.env

    depends_on:
      postgres:
        condition: service_healthy

    environment:

      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/transcendence


  postgres:

    image: postgres:16

    restart: always

    environment:

      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: transcendence

    ports:
      - "5432:5432"

    volumes:

      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d transcendence"]
      interval: 5s
      timeout: 5s
      retries: 5


volumes:

  postgres_data:
