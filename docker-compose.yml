version: "3.9"

services:

  frontend:

    build: ./apps/frontend

    ports:
      - "3000:3000"

    depends_on:
      - backend


  backend:

    build: ./apps/backend

    ports:
      - "4000:4000"

    depends_on:
      - postgres
      - redis

    environment:

      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/transcendence

      REDIS_URL: redis://redis:6379

      JWT_SECRET: supersecret


  postgres:

    image: postgres:16

    restart: always

    environment:

      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: transcendence

    ports:
      - "5432:5432"

    volumes:

      - postgres_data:/var/lib/postgresql/data


  redis:

    image: redis:7

    restart: always

    ports:
      - "6379:6379"


volumes:

  postgres_data:
