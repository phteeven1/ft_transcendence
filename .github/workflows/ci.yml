name: CI

on:
  push:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: transcendence
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d transcendence"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/transcendence
      JWT_SECRET: ci-test-secret
      REDIS_URL: redis://localhost:6379
      MAIL_USER: ci@example.com
      MAIL_PASS: ci-password
      MAIL_FROM: ci@example.com
      APP_URL: http://localhost:3000

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            packages/database/package-lock.json
            apps/backend/package-lock.json

      - name: Install database package
        working-directory: packages/database
        run: npm ci

      - name: Apply database migrations
        working-directory: packages/database
        run: npm run db:migrate:deploy

      - name: Install backend dependencies
        working-directory: apps/backend
        run: npm ci

      - name: Build backend
        working-directory: apps/backend
        run: npm run build

      - name: Run backend tests
        working-directory: apps/backend
        run: npm test

  frontend:
    name: Frontend
    runs-on: ubuntu-latest

    env:
      NEXT_PUBLIC_API_URL: http://localhost:4000
      NEXT_PUBLIC_APP_URL: http://localhost:3000

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: apps/frontend
        run: npm ci

      - name: Lint frontend
        working-directory: apps/frontend
        run: npm run lint

      - name: Build frontend
        working-directory: apps/frontend
        run: npm run build
